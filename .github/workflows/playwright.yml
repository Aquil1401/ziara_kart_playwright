name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Enables Cross-Repository Trigger from Development/Application Repo
  repository_dispatch:
    types: [run-regression-tests, test]
  # Allows manual triggering with optional custom target URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Application URL (e.g. Preview/Staging URL)'
        required: false
        default: 'https://ziarakart.vercel.app'

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ github.event.inputs.target_url || github.event.client_payload.target_url || 'https://ziarakart.vercel.app' }}
        run: npx playwright test

      - name: Upload Playwright Report & Failure Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
